name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors --verbose_failures

      # e2e/smoke is the BCR presubmit test module and models the README-shaped
      # consumer path. It's excluded from //... via --deleted_packages, so build
      # it explicitly here to catch consumer-facing breakage before a release.
      - name: Build and test e2e/smoke consumer module
        run: |
          cd e2e/smoke
          bazel build //...
          bazel test //... --test_output=errors

      - name: Check for uncommitted changes
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Uncommitted changes detected after build/test (e.g. MODULE.bazel.lock). Please run the failing commands locally and commit the updated files."
            echo "$changes"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nested Bazel modules (e2e/smoke, tests/integration/broken_workspace,
      # tests/integration/broken_module) each carry their own .bazelversion:
      # bazelisk resolves the version from the nearest MODULE.bazel boundary
      # and never sees the root pin. Keep every copy identical to the root
      # file.
      - name: Check .bazelversion files are in sync
        run: |
          for f in $(git ls-files '*/.bazelversion'); do
            if ! cmp -- .bazelversion "$f"; then
              echo "::error::$f is out of sync with the root .bazelversion. Keep all copies identical to the root file."
              exit 1
            fi
          done

      # Go sources are formatted by gofmt, which buildifier does not cover.
      # The version comes from go.mod so there is one source of truth, even
      # though Bazel builds with the SDK pinned in MODULE.bazel.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not gofmt-clean. Run 'gofmt -w .' and commit:"
            echo "$unformatted"
            exit 1
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run buildifier (format check)
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -r .

      - name: Run buildifier (lint warnings)
        run: bazel run @buildifier_prebuilt//:buildifier -- -lint=warn -r .
